<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Layar Antrean — NesBooth</title>
  <style>
    :root{--red:#a51622;--deep:#190f16;--cream:#fff7e9}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#111;color:#fff;font-family:Inter,Arial,sans-serif;overflow:hidden}.screen{display:grid;grid-template-columns:minmax(265px,31vw) 1fr;min-height:100vh}.queue-panel{position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:4.4vh 3.4vw;background:linear-gradient(150deg,#ba1828 0%,#63151e 44%,#170d14 100%);overflow:hidden}.queue-panel:before,.queue-panel:after{content:"";position:absolute;border:2px solid #ffffff2b;border-radius:50%;transform:rotate(-33deg)}.queue-panel:before{width:130%;height:38%;top:-12%;left:-44%}.queue-panel:after{width:145%;height:48%;right:-73%;bottom:-14%}.brand,.queue-content,.queue-footer{position:relative;z-index:1}.brand{font-size:clamp(20px,2vw,34px);font-weight:900}.brand b{display:inline-grid;place-items:center;width:1.3em;height:1.3em;border-radius:.28em;background:#fff;color:var(--red);font-size:.73em;margin-right:.35em}.queue-content{margin:auto 0}.label{text-transform:uppercase;letter-spacing:.13em;color:#ffe4b4;font-size:clamp(12px,1.15vw,19px);font-weight:800}.number{font-size:clamp(108px,14vw,235px);line-height:.88;font-weight:950;letter-spacing:-.08em;margin:2.5vh 0;text-shadow:0 5px 0 #0003}.line{height:1px;background:#ffffff55;margin:3vh 0}.next{font-size:clamp(58px,7.5vw,126px);line-height:1;margin-top:1vh;font-weight:900}.queue-footer{font-size:clamp(12px,1vw,17px);color:#ffe4b4}.dot{display:inline-block;width:.7em;height:.7em;border-radius:50%;background:#c6e975;box-shadow:0 0 12px #c6e975;margin-right:.5em}.promo{position:relative;overflow:hidden;background:#0f2433}.slide{position:absolute;inset:0;opacity:0;transition:opacity 1s ease}.slide.active{opacity:1}.slide img{width:100%;height:100%;object-fit:cover}.promo-caption{position:absolute;right:3.2vw;bottom:3.4vh;z-index:2;padding:.55em .9em;border-radius:999px;background:#101820a6;color:#fff;font-size:clamp(12px,1vw,18px);font-weight:700;letter-spacing:.04em}.clock{position:absolute;right:3.2vw;top:3vh;z-index:2;padding:.4em .75em;border-radius:.45em;background:#101820a6;color:#fff;font-size:clamp(16px,1.4vw,26px);font-weight:800}@media(max-width:750px){body{overflow:auto}.screen{grid-template-columns:1fr;min-height:100vh}.queue-panel{min-height:49vh;padding:32px}.promo{min-height:51vh}.number{font-size:29vw}.next{font-size:18vw}}
  </style>
</head>
<body>
  <main class="screen">
    <section class="queue-panel">
      <div class="brand"><b>N</b>NesBooth</div>
      <div class="queue-content">
        <div class="label">Nomor antrean dipanggil</div>
        <div id="number" class="number">—</div>
        <div class="line"></div>
        <div class="label">Antrean berikutnya</div>
        <div id="next" class="next">—</div>
      </div>
      <div class="queue-footer"><span class="dot"></span><span id="status">Menghubungkan antrean…</span></div>
    </section>
    <section class="promo" aria-label="Promosi NesBooth">
      <div class="slide active"><img src="assets/promo-neslo.png" alt="Promosi NESLO"></div>
      <div class="slide"><img src="assets/promo-kopi-favorit.png" alt="Promosi Kopi Favorit"></div>
      <div class="slide"><img src="assets/promo-milo.png" alt="Promosi MILO"></div>
      <div class="slide"><img src="assets/promo-ice-roast.png" alt="Promosi Nescafé Ice Roast"></div>
      <div id="clock" class="clock"></div>
      <div class="promo-caption">Promo minuman NesBooth</div>
    </section>
  </main>
<script>
let last = '', slideIndex = 0;
const slides = [...document.querySelectorAll('.slide')];
function draw(data) {
  const list = data.queue || [];
  const index = Number.isInteger(data.current) && data.current >= 0 ? data.current : -1;
  const now = list[index]?.status === 'Diproses' ? list[index] : list.find(item => item.status === 'Diproses');
  const upcoming = list.find(item => item.status === 'Menunggu');
  number.textContent = now?.n || '—'; next.textContent = upcoming?.n || '—';
  const key = now?.n || '';
  if (key && key !== last) { last = key; try { speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance('Nomor antrean ' + key + ', silakan menuju kasir.')); } catch (error) {} }
}
async function poll() {
  try { const response = await fetch('/api/queue', {cache:'no-store'}); if (!response.ok) throw new Error(); draw(await response.json()); status.textContent = 'Antrean online tersambung'; }
  catch (error) { status.textContent = 'Menunggu koneksi antrean'; }
  finally { setTimeout(poll, 1500); }
}
function updateClock() { clock.textContent = new Date().toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'}); }
function rotatePromo() { slides[slideIndex].classList.remove('active'); slideIndex = (slideIndex + 1) % slides.length; slides[slideIndex].classList.add('active'); }
updateClock(); setInterval(updateClock, 1000); setInterval(rotatePromo, 7000); poll();
</script>
</body>
</html>
